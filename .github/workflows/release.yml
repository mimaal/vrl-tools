name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Enough to create the release and attach the .vsix to it. Nothing here needs
# a Marketplace credential: see "Publishing" below.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Whether the token is set, not the token: `secrets` cannot be read in a
    # step's `if`, and a workflow that tries is rejected before any job starts.
    # The token itself stays on the one step that uses it, out of reach of the
    # build, which runs every npm and cargo build script in the graph.
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain

      - name: Build, test and package
        run: npm run package

      - name: Name the package
        id: vsix
        run: |
          version=$(node -p "require('./editors/vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=editors/vscode/vrl-tools-$version.vsix" >> "$GITHUB_OUTPUT"

      # A tag whose name disagrees with the manifest would produce a release
      # nobody asked for, and a published version cannot be taken back.
      - name: The tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.vsix.outputs.version }}" ]; then
            echo "tag v$tag does not match package.json ${{ steps.vsix.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vrl-tools-${{ steps.vsix.outputs.version }}.vsix
          path: ${{ steps.vsix.outputs.path }}

      # Publishing to the Microsoft Marketplace
      #
      # This workflow deliberately stops at the GitHub release. The last step
      # - uploading the .vsix to the Marketplace - is done by hand from
      # https://marketplace.visualstudio.com/manage.
      #
      # `vsce publish` authenticates with an Azure DevOps Personal Access Token
      # scoped to "All accessible organizations", which is a global PAT, and
      # global PATs in Azure DevOps are retired on 1 December 2026. What
      # replaces them is Entra ID with workload identity federation: a
      # federated credential, an identity enrolled as a member of the
      # publisher, and `vsce publish --azure-credential`. That is a reasonable
      # amount of Azure for a project that ships every few weeks, and it would
      # have to be built before December either way.
      #
      # So the artefact is produced here, reproducibly, by a machine - which
      # was the point - and a person spends two minutes uploading it. If this
      # ever releases often enough for that to hurt, the federation is the
      # thing to build, not a PAT with ten weeks left on it.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            "${{ steps.vsix.outputs.path }}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "Install from the Marketplace, or with \`code --install-extension vrl-tools-${{ steps.vsix.outputs.version }}.vsix\` using the file below. See CHANGELOG.md for what changed."

      # Open VSX: the registry the forks read - VSCodium, Cursor, Windsurf,
      # Gitpod, Theia. Unlike the Microsoft Marketplace above, this one is
      # automated, because it can be: `ovsx` takes an ordinary access token,
      # not an Azure DevOps global PAT with a retirement date on it.
      #
      # The namespace is created once, by hand, with
      # `npx ovsx create-namespace miguel-martinez`; it has to match the
      # manifest's `publisher`. This step only publishes, and skips itself
      # where the secret is not set, so a fork's tag does not fail the release.
      #
      # After the GitHub release, not before: a registry refusing the token
      # once left a tag with no release and no .vsix anywhere. The release is
      # what the Marketplace upload is done from, so it goes out first.
      - name: Open VSX
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"
