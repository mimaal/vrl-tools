transforms:
  route_by_product:
    routes:
      - name: product_b
        condition: '.product == "b"'

  normalize-router:
    routes:
      - name: product_b
        condition: '.source == "b"'

  product-b:
    type: remap
    inputs: [route_by_product.product_b]
    source: |
      .source = "b"
