# Everything every product shares. The routers are in topology.toml and
# normalize-router.toml; each product's file adds a route to both.

  [sources.input-http]
  type = "http_server"
  address = "0.0.0.0:${HTTP_PORT:-8080}"
  decoding.codec = "json"

  [transforms.set-defaults]
  type = "remap"
  inputs = ["normalize-router.product_*"]
  source = '''
  .environment = "production"
  '''

  [sinks.out]
  type = "http"
  inputs = ["set-defaults"]
  uri = "https://collector.example.com/ingest"
  encoding.codec = "json"
  buffer.type = "disk"
  buffer.max_size = ${BUFFER_SIZE_BYTES}
