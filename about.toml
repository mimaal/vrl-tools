# Which licences the shipped WebAssembly module is allowed to carry.
#
# `editors/vscode/THIRD-PARTY-NOTICES.md` is generated from this by
# `npm run gen:notices`, and the generation fails if a dependency arrives under
# a licence that is not listed here. That failure is the point: the notices are
# a claim about what is inside the `.vsix`, and a claim nobody checks is worth
# nothing.
#
# The graph walked is the one that actually ships: vrl-check-wasm, built for
# wasm32-unknown-unknown, without build or dev dependencies.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
]

targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
